[project]
name = "icloud-mcp"
version = "0.1.0"
description = "iCloud Mail (IMAP) MCP server — second brain ingest + Mycelium runtime export"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.7",
]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icloud_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
