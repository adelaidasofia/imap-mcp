[project]
name = "imap-mcp"
version = "0.3.0"
description = "IMAP mail MCP server (iCloud, Gmail, Outlook, Fastmail, any host) — second brain ingest + Mycelium runtime export, with an opt-in write plane for drafts and mailbox management"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.7",
]

[project.scripts]
imap-mcp = "imap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imap_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
